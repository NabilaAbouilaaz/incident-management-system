server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:5173"
              - "http://localhost:5174"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: config-server-route
          uri: http://localhost:8888
          predicates:
            - Path=/config/**
          filters:
            - StripPrefix=1

        - id: eureka-server-web
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/web
          filters:
            - SetPath=/

        - id: eureka-server-static
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**

        - id: user-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

        - id: incident-service-route
          uri: ${INCIDENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/incident-service/**
          filters:
            - StripPrefix=1

        - id: comment-service-route
          uri: ${COMMENT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/comment-service/**
          filters:
            - StripPrefix=1

        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1

        - id: chat-service-route
          uri: ${CHAT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/chat-service/**
          filters:
            - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
    info:
      enabled: true

info:
  app:
    name: gateway
    description: API Gateway du système de gestion des incidents
    version: 1.0.0