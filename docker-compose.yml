networks:
  incidents-net:
    driver: bridge

volumes:
  user-data:
  incident-data:
  comment-data:

services:

  # ─── Service Discovery ─────────────────────────────────────────────────────

  eureka-server:
    build:
      context: .
      dockerfile: services/eureka-server/Dockerfile
    container_name: incidents-eureka
    ports:
      - "8761:8761"
    networks:
      - incidents-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Config Server ─────────────────────────────────────────────────────────

  config-server:
    build:
      context: .
      dockerfile: services/config-server/Dockerfile
    container_name: incidents-config
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///config-repo
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - incidents-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── API Gateway ───────────────────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: incidents-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      USER_SERVICE_URI: "http://user-service:8081"
      INCIDENT_SERVICE_URI: "http://incident-service:8082"
      COMMENT_SERVICE_URI: "http://comment-service:8083"
      NOTIFICATION_SERVICE_URI: "http://notification-service:8084"
      CHAT_SERVICE_URI: "http://chat-service:8085"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORSCONFIGURATIONS_[/**]_ALLOWEDORIGINS: >
        http://localhost:3000,http://localhost:3001
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - incidents-net

  # ─── Microservices ─────────────────────────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: incidents-users
    ports:
      - "8081:8081"
    volumes:
      - user-data:/app/data
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/userdb"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - incidents-net

  incident-service:
    build:
      context: .
      dockerfile: services/incident-service/Dockerfile
    container_name: incidents-core
    ports:
      - "8082:8082"
    volumes:
      - incident-data:/app/data
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/incidentdb"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - incidents-net

  comment-service:
    build:
      context: .
      dockerfile: services/comment-service/Dockerfile
    container_name: incidents-comments
    ports:
      - "8083:8083"
    volumes:
      - comment-data:/app/data
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/commentdb"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - incidents-net

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: incidents-notifications
    ports:
      - "8084:8084"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - incidents-net

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: incidents-chat
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - incidents-net

  # ─── Frontends ─────────────────────────────────────────────────────────────

  admin-dashboard:
    build: ./frontend/admin-dashboard
    container_name: incidents-admin
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - incidents-net

  client-app:
    build: ./frontend/client-app
    container_name: incidents-client
    ports:
      - "3001:80"
    depends_on:
      - gateway
    networks:
      - incidents-net
